<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Genbient</title>
  <meta name="description" content="A generative ambient instrument. Endless procedural soundscapes you can play with a finger, synthesised live in your browser.">
  <meta name="theme-color" content="#0f1417">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genbient">
  <meta property="og:title" content="Genbient">
  <meta property="og:description" content="A generative ambient instrument.">
  <meta property="og:image" content="https://chraltro.github.io/genbient/icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main id="app">
    <header class="top">
      <nav class="modes" aria-label="Mode">
        <button data-mode="listen">Listen</button>
        <button data-mode="run">Run</button>
        <button data-mode="sleep">Sleep<small id="sleep-left"></small></button>
        <button data-mode="kids">Simple</button>
      </nav>
      <span class="top-actions">
        <button class="text-btn" id="btn-rec" aria-label="Record a clip">Rec</button>
        <button class="icon-btn" id="btn-full" aria-label="Play along full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </span>
    </header>

    <section class="title" id="title">
      <h1 id="scene-name">Genbient</h1>
      <p id="scene-tag" class="tag"></p>
      <p id="scene-meta" class="meta"></p>
      <div class="title-actions">
        <button class="text-btn" id="btn-back" hidden aria-label="Back to the previous scene">‹ Back</button>
        <button class="text-btn" id="btn-save" aria-label="Save this scene">Save</button>
        <button class="text-btn" id="btn-share">Share</button>
      </div>
      <div class="panel" id="panel"></div>
    </section>

    <div class="stage">
      <button id="orb" class="orb" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <span class="orb-label" id="orb-label">play</span>
      <p class="breath-text" id="breath-text" aria-live="polite"></p>
      <p class="hint" id="hint">drag anywhere to play along · headphones help</p>
    </div>

    <nav class="dock" aria-label="Controls">
      <button class="dock-btn" data-sheet="create">Scenes</button>
      <button class="dock-btn" data-sheet="layers">Layers</button>
      <button class="dock-main" id="btn-generate" aria-label="Random new scene">Random</button>
      <button class="dock-btn" data-sheet="music">Music</button>
      <button class="dock-btn" data-sheet="sound">Sound</button>
    </nav>
  </main>

  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Settings" inert>
    <button class="grab" id="grab" aria-label="Close"><span></span></button>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <button class="exit-hold" id="exit-hold" aria-label="Hold to leave full screen"><svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle class="fill" cx="18" cy="18" r="15"/></svg><span>×</span></button>
  <p class="immersive-hint" id="immersive-hint">play anywhere · hold the ring to leave</p>
  <div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-act" hidden></button></div>
  <div class="clip" id="clip" hidden>
    <span class="clip-info"><b>Clip ready</b><small id="clip-meta"></small></span>
    <button class="text-btn" id="clip-play">Play</button>
    <button class="btn" id="clip-save">Save clip</button>
    <button class="text-btn" id="clip-discard" aria-label="Discard clip">Discard</button>
  </div>

  <noscript><p class="noscript">Genbient needs JavaScript to make sound.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
